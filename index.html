<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Heart 💎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: radial-gradient(circle, #24133d, #090512 70%);
      font-family: Arial, sans-serif;
    }

    .scene {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Crystal heart */
    .heart {
      position: relative;
      width: 110px;
      height: 110px;
      transform: rotate(-45deg);
      animation: float 3s ease-in-out infinite,
                 glow 2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 15px #d88cff)
              drop-shadow(0 0 35px #9d4edd);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff, #e4a7ff 30%, #8e44ad 70%, #4b1d6b);
    }

    .heart {
      background: linear-gradient(
        135deg,
        #ffffff,
        #eab6ff 25%,
        #b65cff 55%,
        #572080
      );
      border-radius: 10px;
    }

    .heart::before {
      top: -55px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 55px;
    }

    /* Crystal facets */
    .facet {
      position: absolute;
      z-index: 5;
      width: 0;
      height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-bottom: 65px solid rgba(255,255,255,0.35);
      transform: rotate(45deg);
      top: 25px;
      left: 38px;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      color: white;
      font-size: 20px;
      animation: sparkle 2s infinite ease-in-out;
    }

    .s1 { top: 20px; left: 25px; }
    .s2 { top: 55px; right: 15px; animation-delay: .5s; }
    .s3 { bottom: 25px; left: 20px; animation-delay: 1s; }
    .s4 { bottom: 5px; right: 40px; animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% {
        transform: rotate(-45deg) translateY(0);
      }
      50% {
        transform: rotate(-45deg) translateY(-18px);
      }
    }

    @keyframes glow {
      from {
        filter: drop-shadow(0 0 10px #d88cff)
                drop-shadow(0 0 20px #9d4edd);
      }
      to {
        filter: drop-shadow(0 0 25px #ffffff)
                drop-shadow(0 0 45px #c56cff);
      }
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.6) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.4) rotate(180deg);
      }
    }

    .text {
      position: absolute;
      bottom: -35px;
      color: white;
      font-size: 15px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #d88cff;
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="heart">
      <div class="facet"></div>
    </div>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✧</div>

    <div class="text">a little crystal heart 💎</div>

  </div>

</body>
</html>
