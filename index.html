<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crystal Heart 💎</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020207;
    }

    body {
        font-family: Georgia, serif;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    .title {
        position: fixed;
        top: 35px;
        left: 0;
        width: 100%;
        text-align: center;
        color: rgba(255,255,255,.75);
        font-size: 14px;
        letter-spacing: 5px;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 0 20px rgba(255,255,255,.5);
    }

    .hint {
        position: fixed;
        bottom: 30px;
        left: 0;
        width: 100%;
        text-align: center;
        color: rgba(255,255,255,.35);
        font-size: 12px;
        letter-spacing: 2px;
        pointer-events: none;
    }
</style>
</head>

<body>

<div class="title">CRYSTAL HEART</div>
<div class="hint">touch the heart ✦</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import { RoomEnvironment }
from "three/addons/environments/RoomEnvironment.js";


// ------------------------------------------
// SCENE
// ------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020207);

scene.fog = new THREE.FogExp2(
    0x020207,
    0.035
);


// ------------------------------------------
// CAMERA
// ------------------------------------------

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(
    0,
    0,
    7
);


// ------------------------------------------
// RENDERER
// ------------------------------------------

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.35;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.physicallyCorrectLights = true;

document.body.appendChild(renderer.domElement);


// ------------------------------------------
// REALISTIC ENVIRONMENT
// ------------------------------------------

const pmrem =
    new THREE.PMREMGenerator(renderer);

const environment =
    new RoomEnvironment();

scene.environment =
    pmrem.fromScene(environment, 0.04).texture;


// ------------------------------------------
// LIGHTS
// ------------------------------------------

const keyLight =
    new THREE.PointLight(
        0xffffff,
        80,
        20
    );

keyLight.position.set(
    3,
    4,
    5
);

scene.add(keyLight);


const purpleLight =
    new THREE.PointLight(
        0x9c4dff,
        100,
        15
    );

purpleLight.position.set(
    -4,
    1,
    2
);

scene.add(purpleLight);


const blueLight =
    new THREE.PointLight(
        0x448aff,
        80,
        15
    );

blueLight.position.set(
    4,
    -3,
    -2
);

scene.add(blueLight);


// ------------------------------------------
// HEART SHAPE
// ------------------------------------------

const heartShape =
    new THREE.Shape();

heartShape.moveTo(0, 0.45);

heartShape.bezierCurveTo(
    -0.8, 1.25,
    -2.0, 0.75,
    -2.0, -0.2
);

heartShape.bezierCurveTo(
    -2.0, -1.25,
    -0.8, -1.65,
    0, -2.25
);

heartShape.bezierCurveTo(
    0.8, -1.65,
    2.0, -1.25,
    2.0, -0.2
);

heartShape.bezierCurveTo(
    2.0, 0.75,
    0.8, 1.25,
    0, 0.45
);


// ------------------------------------------
// CRYSTAL GEOMETRY
// ------------------------------------------

const geometry =
    new THREE.ExtrudeGeometry(
        heartShape,
        {
            depth: 0.65,

            bevelEnabled: true,

            bevelSegments: 2,

            bevelSize: 0.14,

            bevelThickness: 0.16,

            curveSegments: 16,

            steps: 1
        }
    );


// Center it
geometry.center();


// Scale it
geometry.scale(
    1.05,
    1.05,
    1.05
);


// Rotate so it faces camera
geometry.rotateX(
    Math.PI
);


// ------------------------------------------
// CRYSTAL MATERIAL
// ------------------------------------------

const crystalMaterial =
    new THREE.MeshPhysicalMaterial({

        color: 0xffffff,

        metalness: 0.02,

        roughness: 0.05,

        transmission: 1,

        thickness: 1.6,

        ior: 2.25,

        transparent: true,

        opacity: 0.82,

        clearcoat: 1,

        clearcoatRoughness: 0.04,

        iridescence: 0.55,

        iridescenceIOR: 1.7,

        attenuationColor:
            new THREE.Color(0x9c65ff),

        attenuationDistance: 2.5,

        side: THREE.DoubleSide
    });


const heart =
    new THREE.Mesh(
        geometry,
        crystalMaterial
    );

scene.add(heart);


// ------------------------------------------
// INNER CRYSTAL
// ------------------------------------------

const innerGeometry =
    geometry.clone();

innerGeometry.scale(
    0.82,
    0.82,
    0.82
);

const innerMaterial =
    new THREE.MeshPhysicalMaterial({

        color: 0xffffff,

        transmission: 1,

        thickness: 0.8,

        ior: 2.4,

        roughness: 0.01,

        transparent: true,

        opacity: 0.30,

        iridescence: 0.8,

        clearcoat: 1,

        side: THREE.DoubleSide
    });

const innerHeart =
    new THREE.Mesh(
        innerGeometry,
        innerMaterial
    );

heart.add(innerHeart);


// ------------------------------------------
// CRYSTAL FACET LINES
// ------------------------------------------

const edges =
    new THREE.EdgesGeometry(
        geometry,
        18
    );

const edgeMaterial =
    new THREE.LineBasicMaterial({

        color: 0xffffff,

        transparent: true,

        opacity: 0.22
    });

const crystalEdges =
    new THREE.LineSegments(
        edges,
        edgeMaterial
    );

heart.add(crystalEdges);


// ------------------------------------------
// GLOWING CORE
// ------------------------------------------

const coreGeometry =
    new THREE.SphereGeometry(
        0.55,
        32,
        32
    );

const coreMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xc98cff,

        transparent: true,

        opacity: 0.09
    });

const core =
    new THREE.Mesh(
        coreGeometry,
        coreMaterial
    );

heart.add(core);


// ------------------------------------------
// PARTICLES
// ------------------------------------------

const particleCount = 350;

const positions =
    new Float32Array(
        particleCount * 3
    );

for (
    let i = 0;
    i < particleCount;
    i++
) {

    const radius =
        3 + Math.random() * 5;

    const angle =
        Math.random() * Math.PI * 2;

    positions[i * 3] =
        Math.cos(angle) * radius;

    positions[i * 3 + 1] =
        (Math.random() - 0.5) * 6;

    positions[i * 3 + 2] =
        Math.sin(angle) * radius;
}

const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({

        color: 0xffffff,

        size: 0.025,

        transparent: true,

        opacity: 0.65,

        blending:
            THREE.AdditiveBlending
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(particles);


// ------------------------------------------
// MOUSE / TOUCH
// ------------------------------------------

let mouseX = 0;
let mouseY = 0;

window.addEventListener(
    "pointermove",
    (event) => {

        mouseX =
            (event.clientX /
            window.innerWidth - 0.5);

        mouseY =
            (event.clientY /
            window.innerHeight - 0.5);
    }
);


// ------------------------------------------
// TAP / CLICK
// ------------------------------------------

let pulse = 0;

window.addEventListener(
    "pointerdown",
    () => {

        pulse = 1;

        crystalMaterial.opacity = 1;

        setTimeout(() => {

            crystalMaterial.opacity = 0.82;

        }, 350);
    }
);


// ------------------------------------------
// ANIMATION
// ------------------------------------------

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(
        animate
    );

    const time =
        clock.getElapsedTime();


    // Floating movement
    heart.position.y =
        Math.sin(time * 1.2) * 0.12;


    // Gentle 3D rotation
    heart.rotation.y =
        Math.sin(time * 0.45) * 0.28
        + mouseX * 0.35;


    heart.rotation.x =
        Math.sin(time * 0.35) * 0.08
        + mouseY * 0.12;


    // Inner crystal rotates differently
    innerHeart.rotation.z =
        time * 0.08;


    // Particles slowly rotate
    particles.rotation.y =
        time * 0.025;


    particles.rotation.x =
        Math.sin(time * 0.1) * 0.08;


    // Pulse after touching
    if (pulse > 0) {

        pulse *= 0.92;

        heart.scale.setScalar(
            1 + pulse * 0.12
        );

    } else {

        heart.scale.setScalar(1);

    }


    renderer.render(
        scene,
        camera
    );
}

animate();


// ------------------------------------------
// RESPONSIVE
// ------------------------------------------

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
